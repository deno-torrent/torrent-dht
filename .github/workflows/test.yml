name: quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Deno quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Check formatting
        run: deno task fmt

      - name: Lint
        run: deno task lint

      - name: Type-check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Verify package
        run: deno publish --dry-run
